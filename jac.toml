[project]
name = "DukaFlow"
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.25"

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "neutral"
font = "inter"
radius = "default"
menuAccent = "subtle"
menuColor = "default"
[dependencies]
[dependencies.npm]
radix-ui = "*"
class-variance-authority = "*"
"@fontsource-variable/inter" = "*"
"@tailwindcss/vite" = "^4.1.17"
tailwindcss = "^4.1.17"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"

[byllm.model]
api_key = "${GEMINI_API_KEY:-}"
default_model = "${LLM_MODEL:-gemini/gemini-3.5-flash-lite}"

# Endpoint modules must stay server-side or the client build pulls server code (E5082)
[placement.pins]
"api.products" = "server"
"api.business" = "server"
"api.results" = "server"
"api.contracts" = "server"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]
